name: Synthetic-only regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile project
        run: python -m compileall -q .
      - name: Run fixed offline tests
        run: |
          python test_v1_6.py -q
          python test_v1_5.py -q
          python test_workbench_v1_4.py -q
          python test_navigation_v1_4_1.py -q
          python test_typography_v1_4_2.py -q
          python engine_v1_2/test_v1_2.py -q
          python legacy_v1_3/test_dashboard_v1_3.py -q
      - name: Verify deterministic evaluation generation
        run: python evaluation_v1_6.py
